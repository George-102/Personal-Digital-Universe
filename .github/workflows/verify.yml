name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 产物级单测（home-text / profile-data）读取 out/*.html，必须在 build 之后
      - name: Unit tests
        run: npm test

      - name: Quality metrics (audit + i18n + size)
        run: npm run verify:metrics

      # 缓存 Playwright 浏览器二进制，避免每次下载（网络抖动会导致 install 卡死超时）
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # 缓存命中时仅装系统依赖（浏览器已就位）
      - name: Install system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Run acceptance tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          CI: 'true'
          LHCI_GITHUB_APP_TOKEN: ''

      - name: Upload static export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            lhci-report/
          retention-days: 7
          if-no-files-found: ignore

  # 仅 push main 上线：needs verify 保证门禁全绿，且部署的是被验证的同一份 out/ artifact
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://personal-digital-universe.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Deploy verified out/ to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=personal-digital-universe --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'

  # 同仓库 PR 生成预览 URL；fork PR 不注入 secrets，且被 if 条件显式排除
  preview:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Deploy preview to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=personal-digital-universe --branch="$PREVIEW_BRANCH"
        env:
          PREVIEW_BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
